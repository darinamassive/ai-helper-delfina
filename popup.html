<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="panel">
      <div class="header">
        <span class="label">Скорость</span>
        <span id="rate-value" class="rate">1.00×</span>
      </div>

      <div class="controls">
        <input
          id="rate-slider"
          type="range"
          min="0.1"
          max="4"
          step="0.05"
          value="1"
          disabled
        />
        <button id="reset" type="button" title="Сбросить до 1×" disabled>1×</button>
      </div>

      <p id="status" class="status" hidden></p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
